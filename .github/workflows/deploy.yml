name: Node.js Docker CI/CD to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t node-api:${GITHUB_SHA} .

      - name: Save Docker image
        run: |
          docker save \
            -o node-api.tar \
            node-api:${GITHUB_SHA}

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s\n' "$EC2_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Transfer Docker image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key \
            node-api.tar \
            "${EC2_USER}@${EC2_HOST}:/tmp/node-api-${GITHUB_SHA}.tar"

      - name: Deploy container on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo docker load -i /tmp/node-api-${GITHUB_SHA}.tar &&
             (sudo docker rm -f node-api || true) &&
             sudo docker run -d \
               --name node-api \
               --restart unless-stopped \
               -p 3000:3000 \
               -e PORT=3000 \
               node-api:${GITHUB_SHA} &&
             sudo rm -f /tmp/node-api-${GITHUB_SHA}.tar"

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          sleep 5

          curl --fail --retry 5 --retry-delay 2 \
            "http://${EC2_HOST}:3000/"

      - name: Clean up runner
        if: always()
        run: |
          rm -f node-api.tar
          rm -f ~/.ssh/ec2_key